<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FUCHKA CAFE POS</title>

    <!-- Firebase Core & Database -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; padding: 10px; background: #dce4ec; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .app-container { width: 100%; max-width: 420px; height: 98vh; max-height: 870px; background: white; padding: 14px; border-radius: 16px; border: 3px solid #2e7d32; box-shadow: 0 8px 30px rgba(0,0,0,0.2); display: flex; flex-direction: column; position: relative; }
        .brand-header-box { background: linear-gradient(135deg, #b71c1c 0%, #d32f2f 50%, #880e4f 100%); border: 2px solid #ffd700; border-radius: 12px; padding: 10px 8px; margin-bottom: 10px; text-align: center; box-shadow: 0 4px 10px rgba(183, 28, 28, 0.3); flex-shrink: 0; }
        .brand-header-box h1 { color: #ffffff; margin: 0; font-size: 22px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; }
        .brand-header-box .tagline { color: #ffd700; font-size: 10px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase; margin-top: 2px; }
        .sync-status { font-size: 11px; color: #a5d6a7; margin-top: 4px; font-weight: bold; background: rgba(0,0,0,0.2); padding: 2px 6px; border-radius: 4px; display: inline-block; }
        .menu-scroll-area { flex: 1; overflow-y: auto; padding-right: 4px; margin-bottom: 6px; }
        .category-header { border-bottom: 2px solid #2e7d32; padding-bottom: 3px; color: #2e7d32; margin-top: 10px; margin-bottom: 8px; font-size: 14px; font-weight: 800; text-transform: uppercase; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .item-btn { background: #ffffff; color: #333; border: 1.5px solid #2e7d32; padding: 8px 4px; border-radius: 6px; font-weight: 600; font-size: 12px; cursor: pointer; text-align: center; }
        .item-btn:active { background: #2e7d32; color: white; transform: scale(0.98); }
        .price-tag { color: #d32f2f; font-weight: bold; }
        .bottom-fixed-area { flex-shrink: 0; border-top: 1px solid #ccc; padding-top: 6px; background: #fff; }
        #receipt { background: #f9f9f9; padding: 8px; border-radius: 8px; border: 1px solid #ccc; height: 95px; overflow-y: auto; font-size: 12px; }
        .receipt-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; border-bottom: 1px dotted #ddd; padding-bottom: 3px; }
        .qty-controls { display: flex; align-items: center; gap: 6px; }
        .qty-btn { background: #2e7d32; color: white; border: none; width: 22px; height: 22px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .qty-btn.minus { background: #ff9800; }
        .qty-num { font-weight: bold; font-size: 12px; color: #d32f2f; }
        .item-price { font-weight: bold; width: 45px; text-align: right; }
        .total { font-size: 15px; font-weight: bold; color: #d32f2f; margin-top: 4px; text-align: right; border-top: 2px solid #2e7d32; padding-top: 2px; }
        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-top: 6px; }
        .action-btn { color: white; border: none; padding: 7px 4px; font-size: 11px; font-weight: bold; border-radius: 5px; cursor: pointer; width: 100%; text-align: center; }
        .save-btn { background: #28a745; }
        .hold-btn { background: #ffc107; color: #333; }
        .view-hold-btn { background: #fd7e14; }
        .history-btn { background: #17a2b8; }
        .cancel-list-btn { background: #dc3545; }
        .reset-btn { background: #6c757d; }
        .settle-btn { background: #b71c1c; }
        .settle-history-btn { background: #007bff; }
        .total-sale-btn { background: #6f42c1; grid-column: span 2; }
        
        .developer-footer { text-align: center; margin-top: 8px; font-size: 11px; color: #555; font-weight: 600; border-top: 1px dashed #ddd; padding-top: 4px; }
        .developer-footer span { color: #2e7d32; font-weight: 800; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; width: 92%; max-width: 380px; max-height: 82vh; padding: 15px; border-radius: 10px; overflow-y: auto; border: 2px solid #2e7d32; position: relative; z-index: 1001; }
        .close-btn { background: #6c757d; width: 100%; padding: 8px; margin-top: 10px; border: none; color: white; font-weight: bold; border-radius: 6px; cursor: pointer; }
        
        /* Top Right Corner Cross (X) Button */
        .top-close-btn { position: absolute; top: 8px; right: 12px; background: #dc3545; color: white; border: none; border-radius: 50%; width: 26px; height: 26px; font-size: 14px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .top-close-btn:active { transform: scale(0.9); }

        .bill-item { border: 1px solid #e0e0e0; background: #fafafa; border-radius: 6px; padding: 8px; margin-bottom: 8px; font-size: 12px; }
        .history-item-list { margin: 4px 0; padding-left: 0; list-style: none; }
        .history-item-list li { padding: 2px 0; border-bottom: 1px dashed #eee; display: flex; justify-content: space-between; }
        .btn-group { display: flex; gap: 6px; margin-top: 6px; }
        .restore-btn { background: #28a745; color: white; border: none; padding: 5px 8px; font-size: 11px; border-radius: 4px; cursor: pointer; flex: 1; }
        .delete-btn { background: #dc3545; color: white; border: none; padding: 5px 8px; font-size: 11px; border-radius: 4px; cursor: pointer; flex: 1; }
        
        .alert-box { background: white; padding: 16px; border-radius: 8px; text-align: center; max-width: 300px; width: 85%; border: 2px solid #2e7d32; position: relative; z-index: 2000; }
        .alert-ok-btn { background: #2e7d32; color: white; border: none; padding: 6px 16px; border-radius: 4px; font-size: 13px; font-weight: bold; cursor: pointer; }
        .alert-cancel-btn { background: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 4px; font-size: 13px; font-weight: bold; cursor: pointer; margin-left: 5px; }
        .pass-input { width: 90%; padding: 6px; font-size: 13px; margin-bottom: 8px; border-radius: 4px; border: 1px solid #ccc; text-align: center; }

        .analytics-card { background: #f0f4f8; padding: 12px; border-radius: 10px; margin-bottom: 12px; border: 1px solid #d0dbe5; text-align: center; }
        .analytics-title { font-size: 11px; color: #555; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; }
        .analytics-amount { font-size: 24px; color: #2e7d32; font-weight: 800; margin: 4px 0; }
        .date-picker-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; text-align: left; margin: 8px 0; }
        .date-field label { font-size: 10px; font-weight: bold; color: #444; display: block; margin-bottom: 2px; }
        .date-field input { width: 100%; padding: 8px 6px; border: 1.5px solid #2e7d32; border-radius: 6px; font-size: 12px; font-family: inherit; background: #fff; text-align: center; font-weight: bold; cursor: pointer; }
        .btn-calc { background: #6f42c1; color: white; border: none; padding: 8px; border-radius: 6px; width: 100%; font-weight: bold; cursor: pointer; font-size: 12px; margin-top: 4px; }
        .cancel-banner { background: #ffebee; color: #c62828; padding: 8px; border-radius: 6px; text-align: center; font-weight: bold; margin-bottom: 10px; border: 1px solid #ffcdd2; font-size: 12px; }

        /* Custom In-App Calendar Styles */
        .calendar-box { background: #ffffff; padding: 10px; border-radius: 8px; text-align: center; border: 2px solid #2e7d32; }
        .cal-header { display: flex; justify-content: space-between; align-items: center; font-weight: bold; margin-bottom: 8px; font-size: 14px; color: #2e7d32; }
        .cal-nav-btn { background: #2e7d32; color: white; border: none; border-radius: 4px; padding: 3px 8px; cursor: pointer; font-weight: bold; }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; font-size: 11px; }
        .cal-day-head { font-weight: bold; color: #666; padding: 3px 0; }
        .cal-day { background: #f0f0f0; padding: 7px 0; border-radius: 4px; cursor: pointer; font-weight: bold; color: #333; }
        .cal-day:active, .cal-day.selected { background: #2e7d32; color: white; }
        .cal-day.empty { background: transparent; cursor: default; }
    </style>
</head>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAkIMFv-2u9QnkVt_rktDl6ScdVI2Dkbps",
        authDomain: "billing-app-c2e56.firebaseapp.com",
        databaseURL: "https://billing-app-c2e56-default-rtdb.firebaseio.com",
        projectId: "billing-app-c2e56",
        storageBucket: "billing-app-c2e56.firebasestorage.app",
        messagingSenderId: "513259537812",
        appId: "1:513259537812:web:87f0cc40672f3fbf947b81"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Firebase Offline Persistence (অফলাইন মোড সাপোর্ট)
    db.ref().keepSynced(true);

    let total = 0;
    let currentItems = [];
    const ADMIN_PASSWORD = "admin@123";
    let selectedOrderForDelete = null;
    
    let orders = [];
    let heldOrders = [];
    let cancelledOrders = [];
    let settlementHistory = [];
    let lastSettledTime = 0;

    let activeCalTargetInputId = '';
    let calCurrentYear = new Date().getFullYear();
    let calCurrentMonth = new Date().getMonth();

    db.ref('.info/connected').on('value', (snap) => {
        if (snap.val() === true) {
            document.getElementById('syncStatus').innerText = "⚡ Live Cloud Connected";
            document.getElementById('syncStatus').style.color = "#a5d6a7";
            syncOfflineLocalData();
        } else {
            document.getElementById('syncStatus').innerText = "📱 Offline Mode (Local)";
            document.getElementById('syncStatus').style.color = "#ffb74d";
        }
    });

    function loadLocalCache() {
        orders = JSON.parse(localStorage.getItem('local_orders')) || orders;
        heldOrders = JSON.parse(localStorage.getItem('local_held')) || heldOrders;
        cancelledOrders = JSON.parse(localStorage.getItem('local_cancelled')) || cancelledOrders;
        settlementHistory = JSON.parse(localStorage.getItem('local_settlements')) || settlementHistory;
        lastSettledTime = localStorage.getItem('local_lastSettled') || lastSettledTime;
        updateHoldCount();
        updateCancelCount();
    }
    loadLocalCache();

    db.ref('cafeOrders').on('value', (snapshot) => {
        let val = snapshot.val();
        orders = val ? Object.values(val).filter(item => item && typeof item === 'object') : [];
        localStorage.setItem('local_orders', JSON.stringify(orders));
    });

    db.ref('cafeHeldOrders').on('value', (snapshot) => {
        let val = snapshot.val();
        heldOrders = val ? Object.values(val).filter(item => item && typeof item === 'object') : [];
        localStorage.setItem('local_held', JSON.stringify(heldOrders));
        updateHoldCount();
    });

    db.ref('cafeCancelledOrders').on('value', (snapshot) => {
        let val = snapshot.val();
        cancelledOrders = val ? Object.values(val).filter(item => item && typeof item === 'object') : [];
        localStorage.setItem('local_cancelled', JSON.stringify(cancelledOrders));
        updateCancelCount();
    });

    db.ref('cafeSettlements').on('value', (snapshot) => {
        let val = snapshot.val();
        settlementHistory = val ? Object.values(val).filter(item => item && typeof item === 'object') : [];
        localStorage.setItem('local_settlements', JSON.stringify(settlementHistory));
    });

    db.ref('cafeLastSettled').on('value', (snapshot) => {
        lastSettledTime = snapshot.val() || 0;
        localStorage.setItem('local_lastSettled', lastSettledTime);
    });

    function getTodayString() {
        let now = new Date();
        if (now.getHours() < 5) {
            now.setDate(now.getDate() - 1);
        }
        return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
    }

    function add(name, price) {
        let existingItem = currentItems.find(item => item.name === name);
        if (existingItem) { existingItem.qty += 1; } 
        else { currentItems.push({ name: name, price: price, qty: 1 }); }
        updateCart();
    }

    function increaseQty(index) { currentItems[index].qty += 1; updateCart(); }
    function decreaseQty(index) {
        if (currentItems[index].qty > 1) { currentItems[index].qty -= 1; } 
        else { currentItems.splice(index, 1); }
        updateCart();
    }

    function calculateTotal() {
        total = currentItems.reduce((acc, item) => acc + (item.price * item.qty), 0);
    }

    function updateCart() {
        calculateTotal();
        renderCurrentReceipt();
    }

    function renderCurrentReceipt() {
        let itemsHTML = '';
        currentItems.forEach((item, index) => {
            let itemTotal = (item.price || 0) * item.qty;
            itemsHTML += `
                <div class="receipt-item">
                    <span>• ${item.name}</span>
                    <div class="qty-controls">
                        <button class="qty-btn minus" onclick="decreaseQty(${index})">-</button>
                        <span class="qty-num">${item.qty}</span>
                        <button class="qty-btn" onclick="increaseQty(${index})">+</button>
                    </div>
                    <span class="item-price">₹${itemTotal}</span>
                </div>`;
        });
        document.getElementById('items').innerHTML = itemsHTML;
        document.getElementById('totalPrice').innerText = total;
    }

    function saveOrder() {
        if (total === 0) return customAlert('No item selected!');
        let now = new Date();
        let id = Date.now();
        let orderDetails = {
            id: id,
            timestamp: id,
            date: getTodayString(),
            time: now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            items: JSON.parse(JSON.stringify(currentItems)),
            total: total
        };

        db.ref('cafeOrders/' + id).set(orderDetails);
        orders.push(orderDetails);
        localStorage.setItem('local_orders', JSON.stringify(orders));

        savePendingOffline('pending_orders', orderDetails);
        customAlert(navigator.onLine ? 'Bill Saved & Synced Live!' : 'Bill Saved Offline!');
        resetOrder();
    }

    function holdOrder() {
        if (total === 0) return customAlert('No item to hold!');
        let id = Date.now();
        let holdDetails = {
            id: id,
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            items: JSON.parse(JSON.stringify(currentItems)),
            total: total
        };

        db.ref('cafeHeldOrders/' + id).set(holdDetails);
        heldOrders.push(holdDetails);
        localStorage.setItem('local_held', JSON.stringify(heldOrders));
        updateHoldCount();
        customAlert('Order placed on hold!');
        resetOrder();
    }

    function restoreOrder(index) {
        let ord = heldOrders[index];
        currentItems = JSON.parse(JSON.stringify(ord.items));
        updateCart();
        db.ref('cafeHeldOrders/' + ord.id).remove();
        heldOrders.splice(index, 1);
        localStorage.setItem('local_held', JSON.stringify(heldOrders));
        updateHoldCount();
        closeModal();
    }

    function deleteHoldOrder(index) {
        let ord = heldOrders[index];
        db.ref('cafeHeldOrders/' + ord.id).remove();
        heldOrders.splice(index, 1);
        localStorage.setItem('local_held', JSON.stringify(heldOrders));
        updateHoldCount();
        showHoldList();
    }

    function openPasswordModal(id) { 
        selectedOrderForDelete = id; 
        document.getElementById('adminPassInput').value = ''; 
        document.getElementById('adminReasonInput').value = '';
        document.getElementById('passwordModal').style.display = 'flex'; 
    }

    function verifyPasswordForCancel() {
        let inputPass = document.getElementById('adminPassInput').value;
        let inputReason = document.getElementById('adminReasonInput').value.trim();

        if (inputPass !== ADMIN_PASSWORD) {
            customAlert("❌ Incorrect Password! Access Denied.");
            return;
        }

        if (inputReason === "") {
            customAlert("⚠️ Please enter a cancellation reason.");
            return;
        }

        closePasswordModal();
        executeCancelOrder(inputReason);
    }

    function executeCancelOrder(reason) {
        let canceledItem = orders.find(ord => ord.id === selectedOrderForDelete);
        if (canceledItem) {
            canceledItem.cancelledAt = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            canceledItem.cancelReason = reason;
            
            db.ref('cafeCancelledOrders/' + canceledItem.id).set(canceledItem);
            db.ref('cafeOrders/' + selectedOrderForDelete).remove();

            cancelledOrders.push(canceledItem);
            orders = orders.filter(ord => ord.id !== selectedOrderForDelete);

            localStorage.setItem('local_orders', JSON.stringify(orders));
            localStorage.setItem('local_cancelled', JSON.stringify(cancelledOrders));
            updateCancelCount();
            customAlert("Bill Cancelled Successfully!");
        }
        selectedOrderForDelete = null;
        showHistory();
    }

    function confirmSettlement() {
        let activeOrders = orders.filter(ord => (ord.timestamp || 0) > lastSettledTime);
        let sessionTotal = activeOrders.reduce((acc, curr) => acc + curr.total, 0);
        let now = new Date();
        let id = Date.now();

        let settlementData = {
            id: id,
            date: getTodayString(),
            time: now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            totalBills: activeOrders.length,
            totalAmount: sessionTotal,
            timestamp: id
        };

        lastSettledTime = id;
        db.ref('cafeLastSettled').set(lastSettledTime);
        db.ref('cafeSettlements/' + id).set(settlementData);

        settlementHistory.push(settlementData);
        localStorage.setItem('local_settlements', JSON.stringify(settlementHistory));
        localStorage.setItem('local_lastSettled', lastSettledTime);

        closeSettlementModal();
        customAlert("Sale Settled Live & Recorded! Active sale reset to ₹0.");
    }

    function savePendingOffline(key, data) {
        let pending = JSON.parse(localStorage.getItem(key)) || [];
        pending.push(data);
        localStorage.setItem(key, JSON.stringify(pending));
    }

    function syncOfflineLocalData() {
        let pending = JSON.parse(localStorage.getItem('pending_orders')) || [];
        if (pending.length > 0) {
            pending.forEach((ord) => {
                db.ref('cafeOrders/' + ord.id).set(ord);
            });
            localStorage.removeItem('pending_orders');
        }
    }

    function updateHoldCount() { document.getElementById('holdCount').innerText = heldOrders.length; }
    function updateCancelCount() { document.getElementById('cancelCount').innerText = cancelledOrders.length; }

    function resetOrder() {
        total = 0;
        currentItems = [];
        document.getElementById('items').innerHTML = '';
        document.getElementById('totalPrice').innerText = '0';
    }

    function customAlert(msg) { document.getElementById('alertMessage').innerText = msg; document.getElementById('alertModal').style.display = 'flex'; }
    function closeAlert() { document.getElementById('alertModal').style.display = 'none'; }
    function closeModal() { document.getElementById('modal').style.display = 'none'; }
    function closePasswordModal() { document.getElementById('passwordModal').style.display = 'none'; }

    function showHistory() {
        document.getElementById('modalTitle').innerText = 'All Saved Bills';
        let listDiv = document.getElementById('modalList');
        document.getElementById('modalFilterContainer').innerHTML = '';
        if (orders.length === 0) { listDiv.innerHTML = '<p style="text-align:center;">No bills found.</p>'; } 
        else {
            let html = '';
            [...orders].reverse().forEach((ord) => {
                let itemsList = (ord.items || []).map(i => `<li><span>• ${i.name} x${i.qty}</span> <span>₹${i.price * i.qty}</span></li>`).join('');
                html += `<div class="bill-item"><b>Date: ${ord.date} (${ord.time})</b><ul class="history-item-list">${itemsList}</ul><div style="color:#d32f2f; font-weight:bold; text-align:right;">Total: ₹${ord.total}</div><button class="delete-btn" style="width:100%; margin-top:6px;" onclick="openPasswordModal(${ord.id})">Cancel Bill</button></div>`;
            });
            listDiv.innerHTML = html;
        }
        document.getElementById('modal').style.display = 'flex';
    }

    function openTotalSaleModal() {
        let todayStr = getTodayString();
        document.getElementById('modalTitle').innerText = 'Sale Analytics';

        let currentSessionOrders = orders.filter(ord => (ord.timestamp || 0) > lastSettledTime);
        let activeSessionTotal = currentSessionOrders.reduce((acc, curr) => acc + curr.total, 0);
        
        let containerHtml = `
            <div class="analytics-card" style="background:#fff3e0; border-color:#ffe0b2;">
                <div class="analytics-title" style="color:#e65100;">Active Sale (Unsettled)</div>
                <div class="analytics-amount" style="color:#d32f2f;">₹${activeSessionTotal}</div>
                <small style="color:#666;">Active Bills Count: <b>${currentSessionOrders.length}</b></small>
            </div>

            <div class="analytics-card">
                <div class="analytics-title">Custom Date Range Sale</div>
                <div class="date-picker-grid">
                    <div class="date-field">
                        <label>From Date:</label>
                        <input type="text" id="startDate" value="${todayStr}" readonly onclick="openCustomCalendar('startDate')">
                    </div>
                    <div class="date-field">
                        <label>To Date:</label>
                        <input type="text" id="endDate" value="${todayStr}" readonly onclick="openCustomCalendar('endDate')">
                    </div>
                </div>
                <button class="btn-calc" onclick="calculateCustomSale()">Show Selected Sale</button>
            </div>
            
            <div id="customResultArea"></div>`;
        
        document.getElementById('modalFilterContainer').innerHTML = containerHtml;
        document.getElementById('modalList').innerHTML = '';
        document.getElementById('modal').style.display = 'flex';
    }

    function openCustomCalendar(inputId) {
        activeCalTargetInputId = inputId;
        let currentVal = document.getElementById(inputId).value;
        if(currentVal) {
            let parts = currentVal.split('-');
            calCurrentYear = parseInt(parts[0]);
            calCurrentMonth = parseInt(parts[1]) - 1;
        }
        renderCalendarUI();
        document.getElementById('calendarModal').style.display = 'flex';
    }

    function closeCalendarModal() {
        document.getElementById('calendarModal').style.display = 'none';
    }

    function changeCalMonth(step) {
        calCurrentMonth += step;
        if (calCurrentMonth < 0) {
            calCurrentMonth = 11;
            calCurrentYear -= 1;
        } else if (calCurrentMonth > 11) {
            calCurrentMonth = 0;
            calCurrentYear += 1;
        }
        renderCalendarUI();
    }

    function renderCalendarUI() {
        const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        document.getElementById('calMonthYearTitle').innerText = `${months[calCurrentMonth]} ${calCurrentYear}`;

        let gridHtml = `
            <div class="cal-day-head">Su</div>
            <div class="cal-day-head">Mo</div>
            <div class="cal-day-head">Tu</div>
            <div class="cal-day-head">We</div>
            <div class="cal-day-head">Th</div>
            <div class="cal-day-head">Fr</div>
            <div class="cal-day-head">Sa</div>`;

        let firstDay = new Date(calCurrentYear, calCurrentMonth, 1).getDay();
        let totalDays = new Date(calCurrentYear, calCurrentMonth + 1, 0).getDate();

        for (let i = 0; i < firstDay; i++) {
            gridHtml += `<div class="cal-day empty"></div>`;
        }

        let selectedVal = document.getElementById(activeCalTargetInputId) ? document.getElementById(activeCalTargetInputId).value : '';

        for (let d = 1; d <= totalDays; d++) {
            let monthStr = String(calCurrentMonth + 1).padStart(2, '0');
            let dayStr = String(d).padStart(2, '0');
            let fullDateStr = `${calCurrentYear}-${monthStr}-${dayStr}`;

            let isSelected = selectedVal === fullDateStr ? 'selected' : '';
            gridHtml += `<div class="cal-day ${isSelected}" onclick="selectCalDate('${fullDateStr}')">${d}</div>`;
        }

        document.getElementById('calDaysGrid').innerHTML = gridHtml;
    }

    function selectCalDate(dateStr) {
        if(activeCalTargetInputId) {
            document.getElementById(activeCalTargetInputId).value = dateStr;
        }
        closeCalendarModal();
    }

    function calculateCustomSale() {
        let startVal = document.getElementById('startDate').value.trim();
        let endVal = document.getElementById('endDate').value.trim();

        if (!startVal || !endVal) {
            customAlert("Please enter both dates!");
            return;
        }

        let filtered = orders.filter(ord => ord.date >= startVal && ord.date <= endVal);
        let grandTotal = filtered.reduce((acc, curr) => acc + curr.total, 0);

        let resultHtml = `
            <div class="analytics-card" style="background:#e8f5e9; border-color:#c8e6c9;">
                <div class="analytics-title" style="color:#2e7d32;">Custom Range Total</div>
                <div class="analytics-amount">₹${grandTotal}</div>
                <small style="color:#555;">Range: <b>${startVal}</b> to <b>${endVal}</b></small><br>
                <small style="color:#555;">Total Bills: <b>${filtered.length}</b></small>
            </div>`;

        document.getElementById('customResultArea').innerHTML = resultHtml;
    }

    function showHoldList() {
        document.getElementById('modalTitle').innerText = 'Held Orders';
        let listDiv = document.getElementById('modalList');
        document.getElementById('modalFilterContainer').innerHTML = '';
        if (heldOrders.length === 0) { listDiv.innerHTML = '<p style="text-align:center;">No held orders.</p>'; } 
        else {
            let html = '';
            heldOrders.forEach((ord, index) => {
                html += `<div class="bill-item"><b>Hold Bill #${index + 1} (${ord.time})</b><div style="color:#d32f2f; font-weight:bold;">Total: ₹${ord.total}</div><div class="btn-group"><button class="restore-btn" onclick="restoreOrder(${index})">Restore</button><button class="delete-btn" onclick="deleteHoldOrder(${index})">Delete</button></div></div>`;
            });
            listDiv.innerHTML = html;
        }
        document.getElementById('modal').style.display = 'flex';
    }

    function showCancelledHistory() {
        document.getElementById('modalTitle').innerText = 'Cancelled Bills';
        let listDiv = document.getElementById('modalList');
        
        let bannerHtml = `
            <div class="cancel-banner">
                Total Cancelled Orders: <b>${cancelledOrders.length}</b>
            </div>`;
            
        document.getElementById('modalFilterContainer').innerHTML = bannerHtml;

        if (cancelledOrders.length === 0) { 
            listDiv.innerHTML = '<p style="text-align:center; font-size:12px; color:#777;">No cancelled bills found.</p>'; 
        } else {
            let html = '';
            [...cancelledOrders].reverse().forEach((ord) => {
                html += `
                    <div class="bill-item" style="border-left: 4px solid #dc3545;">
                        <b style="color:#dc3545;">Cancelled</b> - ${ord.date} (${ord.time})<br>
                        <b>Total: ₹${ord.total}</b><br>
                        <small style="color:#d32f2f;"><b>Reason:</b> ${ord.cancelReason || 'N/A'}</small>
                    </div>`;
            });
            listDiv.innerHTML = html;
        }
        document.getElementById('modal').style.display = 'flex';
    }

    function showSettlementHistory() {
        document.getElementById('modalTitle').innerText = 'Settlement Ledger History';
        let listDiv = document.getElementById('modalList');
        document.getElementById('modalFilterContainer').innerHTML = '';

        if (settlementHistory.length === 0) {
            listDiv.innerHTML = '<p style="text-align:center; font-size:12px; color:#777;">No settlement records found.</p>';
        } else {
            let html = '';
            [...settlementHistory].reverse().forEach((st) => {
                html += `
                    <div class="bill-item" style="border-left: 4px solid #b71c1c; background: #fff5f5;">
                        <b style="color:#b71c1c;">Settled Date: ${st.date} (${st.time})</b><br>
                        <span>Total Bills Settled: <b>${st.totalBills}</b></span>
                        <div style="color:#2e7d32; font-weight:bold; font-size:14px; margin-top:2px;">
                            Settled Amount: ₹${st.totalAmount}
                        </div>
                    </div>`;
            });
            listDiv.innerHTML = html;
        }
        document.getElementById('modal').style.display = 'flex';
    }

    function openSettlementModal() {
        let activeOrders = orders.filter(ord => (ord.timestamp || 0) > lastSettledTime);
        let sessionTotal = activeOrders.reduce((acc, curr) => acc + curr.total, 0);
        document.getElementById('settlementDetails').innerHTML = `<b>Current Session Bills:</b> ${activeOrders.length}<br><b>Current Session Sale:</b> ₹${sessionTotal}`;
        document.getElementById('settlementModal').style.display = 'flex';
    }
    function closeSettlementModal() { document.getElementById('settlementModal').style.display = 'none'; }
</script>
</body>
</html>
