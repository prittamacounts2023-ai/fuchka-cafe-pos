<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fuchka Cafe POS</title>

    <!-- Firebase Core & Database -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; padding: 10px; background: #dce4ec; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .app-container { width: 100%; max-width: 420px; height: 98vh; max-height: 870px; background: #eef2f6; padding: 12px; border-radius: 16px; border: 3px solid #1e293b; box-shadow: 0 8px 30px rgba(0,0,0,0.2); display: flex; flex-direction: column; position: relative; }
        
        .brand-header-box { background: #0f172a; border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; color: white; }
        .brand-header-box h1 { margin: 0; font-size: 16px; font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase; }
        .brand-header-box .tagline { color: #94a3b8; font-size: 11px; margin-top: 2px; }

        /* Menu Container Style */
        .menu-scroll-area { flex: 1; overflow-y: auto; padding-right: 2px; }
        .category-header { font-size: 11px; font-weight: 800; color: #38bdf8; background: #0f172a; padding: 5px 8px; border-radius: 6px; margin: 10px 0 6px 0; text-transform: uppercase; letter-spacing: 0.5px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .item-btn { background: white; border: 1px solid #cbd5e1; padding: 10px; border-radius: 8px; font-weight: bold; font-size: 11px; color: #0f172a; cursor: pointer; text-align: left; display: flex; flex-direction: column; justify-content: space-between; min-height: 55px; }
        .price-tag { color: #ef4444; font-size: 12px; font-weight: 800; margin-top: 4px; }

        .developer-footer { text-align: center; margin-top: 6px; font-size: 10px; color: #64748b; font-weight: 600; border-top: 1px dashed #cbd5e1; padding-top: 4px; flex-shrink: 0; }
        .developer-footer span { color: #0f172a; font-weight: 800; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="brand-header-box">
        <div>
            <h1>Fuchka Cafe POS</h1>
            <div class="tagline">Billing Terminal</div>
        </div>
    </div>

    <!-- Dynamic Menu Loaded From Firebase -->
    <div id="dynamicMenuContainer" class="menu-scroll-area">
        <p style="text-align:center; font-size:11px; color:#64748b; margin-top: 20px;">Loading Menu...</p>
    </div>

    <div class="developer-footer">
        Designed & Developed by <span>Pritam Das</span>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAkIMFv-2u9QnkVt_rktDl6ScdVI2Dkbps",
        authDomain: "billing-app-c2e56.firebaseapp.com",
        databaseURL: "https://billing-app-c2e56-default-rtdb.firebaseio.com",
        projectId: "billing-app-c2e56",
        storageBucket: "billing-app-c2e56.firebasestorage.app",
        messagingSenderId: "513259537812",
        appId: "1:513259537812:web:87f0cc40672f3fbf947b81"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Real-time listener to load menu categories and items saved from the Admin Panel
    db.ref('cafeMenuItems').on('value', (snapshot) => {
        let val = snapshot.val();
        let container = document.getElementById('dynamicMenuContainer');
        if (!val) {
            container.innerHTML = '<p style="text-align:center; color:#64748b; font-size:11px;">No menu items found. Please add items from the Admin Panel.</p>';
            return;
        }

        // Convert firebase object to array of items
        let itemsArray = Object.values(val);
        
        // Group items by category (cat) automatically
        let grouped = {};
        itemsArray.forEach(item => {
            if (item && item.name && item.price) {
                let cat = (item.cat || 'OTHER').toUpperCase();
                if (!grouped[cat]) grouped[cat] = [];
                grouped[cat].push(item);
            }
        });

        let html = '';
        Object.keys(grouped).forEach(category => {
            html += `<div class="category-header">📁 ${category}</div><div class="grid">`;
            grouped[category].forEach(item => {
                let safeName = item.name.replace(/'/g, "\\'");
                html += `<button class="item-btn" onclick="addItemToCart('${safeName}', ${item.price})">
                    <span>${item.name}</span>
                    <span class="price-tag">₹${item.price}</span>
                </button>`;
            });
            html += `</div>`;
        });
        
        container.innerHTML = html;
    });

    // Dummy function to prevent error when clicking items (you can attach your cart logic here)
    function addItemToCart(name, price) {
        console.log("Added to cart:", name, price);
    }
</script>
</body>
</html>
